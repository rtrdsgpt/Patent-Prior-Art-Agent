[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patent-agent"
version = "0.1.0"
description = "Patent prior-art / freedom-to-operate agent"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["schema", "mcp_server"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires live BigQuery access (real GCP credentials configured)",
    "slow: loads a real local model (embedding/reranker) or vector store; no credentials needed but not a fast unit test",
]

[tool.ruff]
line-length = 140
exclude = ["scripts", ".venv"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = [
    "E501",  # line length handled by the line-length setting above, not as a hard error
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
