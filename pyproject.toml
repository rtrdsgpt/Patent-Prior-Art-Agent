[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires live BigQuery/vector-store access (real GCP credentials configured)",
]

[tool.ruff]
line-length = 140
exclude = ["scripts", ".venv"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = [
    "E501",  # line length handled by the line-length setting above, not as a hard error
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
